name: Build and Release Docker Image

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - 'v*'
      - '20*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'changelog-update')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: |
          docker build -t bastion:test .

      - name: Run automated test harness
        run: |
          chmod +x ./tests/test_bastion.sh
          ./tests/test_bastion.sh bastion:test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        uses: docker/metadata-action@v5
        id: docker_metadata
        with:
          images: |
            ghcr.io/${{ github.repository }}/bastion
            docker.io/${{ vars.DOCKERHUB_LOGIN }}/bastion
          tags: |
            type=raw,value=latest
            type=raw,value={{ date 'YYYY.MM' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          tags: ${{ steps.docker_metadata.outputs.tags }}
          labels: ${{ steps.docker_metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max