---
name: Generate CHANGELOG.md

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */1 *"  # Runs on the first of every month

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-update
  cancel-in-progress: true

jobs:
  update_changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest Alpine and get SHA256
        run: |
          docker pull alpine:latest
          ALPINE_SHA=$(docker image inspect alpine:latest --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "ALPINE_SHA=$ALPINE_SHA" >> $GITHUB_ENV

      - name: Check versions of openssh-server, openssh-client, gnupg, and curl
        run: |
          docker run --rm alpine:latest sh -c '
           apk update &&
           apk add --no-cache openssh-server openssh-client gnupg curl &&
           apk info -w openssh-server openssh-client gnupg curl' > versions.txt

          cat versions.txt

          OPENSSH_SERVER_VER=$(grep -o 'openssh-server-[0-9].*' versions.txt | head -n1 | awk '{print $1}')
          OPENSSH_CLIENT_VER=$(grep -o 'openssh-client-[0-9].*' versions.txt | head -n1 | awk '{print $1}')
          if [ -z "$OPENSSH_CLIENT_VER" ]; then
            OPENSSH_CLIENT_VER=$(grep -o 'openssh-client-default-[0-9].*' versions.txt | head -n1 | awk '{print $1}')
          fi
          GNUPG_VER=$(grep -o 'gnupg-.*' versions.txt | awk '{print $1}')
          CURL_VER=$(grep -o 'curl-.*' versions.txt | awk '{print $1}')

          echo "OPENSSH_SERVER_VER=$OPENSSH_SERVER_VER" >> "$GITHUB_ENV"
          echo "OPENSSH_CLIENT_VER=$OPENSSH_CLIENT_VER" >> "$GITHUB_ENV"
          echo "GNUPG_VER=$GNUPG_VER" >> "$GITHUB_ENV"
          echo "CURL_VER=$CURL_VER" >> "$GITHUB_ENV"

      - name: Prepend new entry to CHANGELOG.md
        run: |
          DATE=$(date '+%Y-%m')
          HEADER="## $DATE\n----------------\ndocker.io/alpine@$ALPINE_SHA\n- $OPENSSH_SERVER_VER\n- $OPENSSH_CLIENT_VER\n- $GNUPG_VER\n- $CURL_VER"

          # Prepend new entry if not already present in CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            if grep -q "^## $DATE" CHANGELOG.md; then
              echo "CHANGELOG.md already has an entry for $DATE; skipping duplicate prepend."
            else
              printf "%b\n\n%s\n" "$HEADER" "$(cat CHANGELOG.md)" > CHANGELOG.md
            fi
          else
            printf "%b\n" "$HEADER" > CHANGELOG.md
          fi

          head -n 35 CHANGELOG.md
          rm versions.txt
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "changelog-update"
          commit-message: Generate CHANGELOG.md for ${{ env.DATE }}
          title: Generate CHANGELOG.md for ${{ env.DATE }}
          body: |
            docker.io/alpine@${{ env.ALPINE_SHA }}
            - ${{ env.OPENSSH_SERVER_VER }}
            - ${{ env.OPENSSH_CLIENT_VER }}
            - ${{ env.GNUPG_VER }}
            - ${{ env.CURL_VER }}

            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
